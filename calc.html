<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="./script.js" defer></script>
</head>

<body class="bg-black d-flex justify-content-center align-items-center vh-100">

    <div class="card bg-dark border-0 rounded-4 shadow" style="width:320px;">
        <div class="card-body">

            <input type="text" id="displayData"
                class="form-control bg-black text-white border-0 fs-2 py-3 mb-3 text-end"
                placeholder="0" readonly>

            <div class="row g-2">

                <div class="col-3"><button onclick="clearAll()" class="btn btn-danger w-100 py-3 fs-4">AC</button></div>
                <div class="col-3"><button onclick="removeLastItem()" class="btn btn-primary w-100 py-3 fs-4">⌫</button></div>
                <div class="col-3"><button onclick="displaydata('%')" class="btn btn-secondary w-100 py-3 fs-4">%</button></div>
                <div class="col-3"><button onclick="displaydata('/')" class="btn btn-warning w-100 py-3 fs-4">/</button></div>

                <div class="col-3"><button onclick="displaydata('7')" class="btn btn-secondary w-100 py-3 fs-4">7</button></div>
                <div class="col-3"><button onclick="displaydata('8')" class="btn btn-secondary w-100 py-3 fs-4">8</button></div>
                <div class="col-3"><button onclick="displaydata('9')" class="btn btn-secondary w-100 py-3 fs-4">9</button></div>
                <div class="col-3"><button onclick="displaydata('*')" class="btn btn-warning w-100 py-3 fs-4">*</button></div>

                <div class="col-3"><button onclick="displaydata('4')" class="btn btn-secondary w-100 py-3 fs-4">4</button></div>
                <div class="col-3"><button onclick="displaydata('5')" class="btn btn-secondary w-100 py-3 fs-4">5</button></div>
                <div class="col-3"><button onclick="displaydata('6')" class="btn btn-secondary w-100 py-3 fs-4">6</button></div>
                <div class="col-3"><button onclick="displaydata('-')" class="btn btn-warning w-100 py-3 fs-4">-</button></div>

                <div class="col-3"><button onclick="displaydata('1')" class="btn btn-secondary w-100 py-3 fs-4">1</button></div>
                <div class="col-3"><button onclick="displaydata('2')" class="btn btn-secondary w-100 py-3 fs-4">2</button></div>
                <div class="col-3"><button onclick="displaydata('3')" class="btn btn-secondary w-100 py-3 fs-4">3</button></div>
                <div class="col-3"><button onclick="displaydata('+')" class="btn btn-warning w-100 py-3 fs-4">+</button></div>

                <div class="col-3"><button onclick="displaydata('0')" class="btn btn-secondary w-100 py-3 fs-4">0</button></div>
                <div class="col-3"><button onclick="displaydata('.')" class="btn btn-secondary w-100 py-3 fs-4">.</button></div>
                <div class="col-6"><button onclick="result()" class="btn btn-success w-100 py-3 fs-4">=</button></div>

            </div>
        </div>
    </div>

</body>
</html>
